image: node:20-alpine

# Cache node_modules to speed up builds
cache:
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

pages:
  stage: deploy
  script:
    - npm run build
    # GitLab Pages serves the directory named 'public'. The repo already has a 
    # 'public/' dir (Vite's static assets, already copied into dist by the build),
    # so remove it first - otherwise `mv` nests dist inside it.
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    - main
    - master

